<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kartu og:image Kedaiin</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: #faf5ef;
    color: #1c1917;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", "DejaVu Sans", Arial, sans-serif;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    padding: 56px;
    box-sizing: border-box;
    align-items: center;
    border-top: 10px solid #9a3412;
  }
  .eyebrow {
    font-family: ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
    font-size: 15px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #7c2d12;
    margin: 0 0 16px;
  }
  h1 { font-size: 46px; line-height: 1.1; letter-spacing: -.02em; margin: 0 0 18px; }
  p { font-size: 20px; line-height: 1.5; color: #57534e; margin: 0 0 28px; }
  .url { font-family: ui-monospace, "DejaVu Sans Mono", Consolas, monospace; font-size: 18px; color: #7c2d12; }
  .shot { background: #fff; border: 1px solid #e7ded3; border-radius: 10px; padding: 8px; }
  .shot img { width: 100%; display: block; border-radius: 6px; border: 1px solid #f3ece3; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">Kasir warung &amp; resto kecil</p>
    <h1>Kasir, dapur, dan laporan dalam satu PC.</h1>
    <p>Data ada di PC kasir sendiri. Internet mati, resto tetap jalan.</p>
    <p class="url">kedaiin.id</p>
  </div>
  <div class="shot"><img src="assets/hero-bill.webp" alt="" width="1280" height="800"></div>
</body>
</html>
